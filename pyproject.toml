[project]
name = "llm-console"
version = "0.1.0"
description = "Web app that starts and stops the inference engines on remote hosts over ssh"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
# Not an installable package: the app runs from the checkout (and from /app in the image).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
