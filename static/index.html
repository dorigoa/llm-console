<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>llm-console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f8a4c'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>llm-console</h1>
    <span class="badge" id="dry-run-badge" hidden title="Test mode: no command is run">dry-run</span>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Host"></nav>

  <main id="panels">
    <p class="muted" id="loading">Loading…</p>
  </main>

  <footer class="footer muted" id="footer"></footer>

  <dialog id="run-dialog" aria-labelledby="run-title">
    <form id="run-form" method="dialog">
      <h2 id="run-title">Run</h2>
      <p class="muted" id="run-host"></p>
      <fieldset>
        <legend>Quantization</legend>
        <div class="radios" id="run-radios"></div>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="run-cancel">Cancel</button>
        <button type="submit" class="btn btn-run" id="run-confirm" disabled>Start</button>
      </div>
    </form>
  </dialog>

  <dialog id="notice-dialog" aria-labelledby="notice-title" aria-describedby="notice-text">
    <form method="dialog">
      <h2 id="notice-title"></h2>
      <p id="notice-text"></p>
      <div class="dialog-actions">
        <button type="submit" class="btn btn-ghost" autofocus>OK</button>
      </div>
    </form>
  </dialog>

  <template id="section-template">
    <article class="card">
      <header class="card-head">
        <h2 class="card-title"></h2>
        <span class="card-host muted"></span>
      </header>
      <p class="card-note muted" hidden>Not configured: no commands are defined for this section.</p>
      <div class="card-actions">
        <button type="button" class="btn btn-run" data-action="run">Run</button>
        <button type="button" class="btn btn-stop" data-action="stop">Stop</button>
      </div>
      <p class="card-status" role="status" aria-live="polite"></p>
      <details class="card-output" hidden>
        <summary>Output</summary>
        <pre></pre>
      </details>
    </article>
  </template>
</body>
</html>
